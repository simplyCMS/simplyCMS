# Конфігурація pnpm для магазину.
#
# 🔴 Файл потрібен, навіть якщо магазин не є workspace-ом: з pnpm 11 це ЄДИНЕ
# місце, звідки читаються налаштування. Поле `pnpm` у `package.json`
# ігнорується мовчки, а `.npmrc` — лише для auth і registry.
#
# `allowBuilds` — allowlist пакетів, яким дозволено виконувати install-скрипти.
# Без нього `pnpm install` обривається з `ERR_PNPM_IGNORED_BUILDS`, а `pnpm
# build` перезапускає install і теж падає — магазин не збереться взагалі.
# `esbuild` тягне vite; `sharp` і `unrs-resolver` — типові для цього стека
# нативні залежності, лишені наперед, щоб їхня поява не ламала збірку.
allowBuilds:
  esbuild: true
  sharp: true
  unrs-resolver: true
# `minimumReleaseAge` навмисно НЕ перевизначено: дефолт pnpm 11 — 1 доба, і це
# захист від supply-chain-атак через щойно скомпрометований реліз. Наслідок,
# про який варто знати: у перші 24 години після виходу нової версії
# `@simplycms/*` установка впреться в цю політику. Це очікувано — або зачекай
# добу, або тимчасово додай сюди `minimumReleaseAge: 0` і прибери після
# установки. Разовий прапорець на `pnpm install` не спрацює: `pnpm build`
# перезапускає install сам (`runDepsStatusCheck`) уже без прапорця.
