<!doctype html>
<!--
  Фікстура для смоку `tests/design-import-inspect.test.ts` (Фаза 2, задача
  §2.A, план Р3). Кольори/шрифти/radius/googleapis-лінки навмисно ІДЕНТИЧНІ
  `tests/fixtures/design-import/inspection.fixture.mjs` (Фаза 1) — контракт
  між скриптами перевіряється і без браузера (`mapTokens(sampleInspection)`),
  і з браузером (`inspect.mjs` семплить саме цей HTML). Рендериться через
  `page.setContent` — мережі немає, `<link>` на googleapis НЕ завантажується
  фактично, лише його `href` читається семплером.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Design Import Reference</title>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@700;800&display=swap"
    />
    <style>
      body {
        margin: 0;
        background: #ffffff;
        color: #18181b;
        font-family: Inter, system-ui, sans-serif;
        font-weight: 400;
        font-size: 16px;
      }
      h1 {
        font-family: Manrope, system-ui, sans-serif;
        font-weight: 700;
        font-size: 32px;
      }
      section {
        background: #cccccc;
        padding: 24px;
        margin-bottom: 32px;
      }
      .card {
        background: #ffffff;
        border: 1px solid #e4e4e7;
        border-radius: 8px;
        box-shadow: 0 1px 2px rgba(0, 0, 0, 0.05);
        padding: 16px;
        margin-bottom: 16px;
      }
      .card img {
        border-radius: 8px;
      }
      .primary-button {
        background: #2563eb;
        color: #ffffff;
        border: none;
        border-radius: 8px;
        padding: 8px 16px;
      }
      .accent {
        background: #7c3aed;
        color: #ffffff;
        border-radius: 8px;
        padding: 4px 8px;
      }
      .badge {
        background: #fbbf24;
        border-radius: 4px;
        display: inline-block;
        padding: 2px 6px;
      }
    </style>
  </head>
  <body>
    <h1>Reference storefront</h1>
    <section>
      <div class="card">
        <img src="data:," width="64" height="64" alt="" />
        <p>Card body text describing a product.</p>
        <button class="primary-button">Buy now</button>
        <span class="accent">Featured</span>
        <span class="badge">New</span>
      </div>
      <ul>
        <li>First list item with body copy.</li>
        <li>Second list item with body copy.</li>
      </ul>
    </section>
  </body>
</html>
