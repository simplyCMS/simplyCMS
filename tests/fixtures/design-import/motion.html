<!doctype html>
<!--
  Фікстура motion-капчера для `tests/design-import-motion.test.ts` (інкремент
  Б.2, Фаза 1, план Р1/Р4/Р6). Окрема від `reference.html` навмисно: та
  фіксує КОЛІРНИЙ контракт (і будь-яка правка ламає її асерти 1:1 з
  `inspection.fixture.mjs`), ця — рухомий.

  Що вона доводить:
  • transitions — три різні тривалості/easing-и, зокрема `cubic-bezier(…)` з
    комами всередині дужок (наївний `split(',')` рвав би його на чотири
    «значення»), плюс `transition: none` і нульова тривалість — обидва мають
    бути відкинуті;
  • keyframes — три імені, одне з них ВСЕРЕДИНІ `@media` (плаский обхід
    верхнього рівня його не побачив би);
  • reveal — справжній IntersectionObserver: секції стартують `opacity: 0` +
    `translateY`, клас-маркер отримують лише при перетині, тож дельта
    зʼявляється тільки після реального скролу;
  • jsLibraries — `<script src>` на недосяжний CDN (`.invalid` не резолвиться
    ніколи; тест вантажить фікстуру через `setContent(…, domcontentloaded)`,
    тому мережа не тримає завантаження) + inline-глобал `window.gsap` +
    `data-framer-*` атрибут — усі три канали детекції разом.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Design Import Motion Reference</title>
    <script
      async
      src="https://cdn.example.invalid/gsap/3.12.5/gsap.min.js"
    ></script>
    <script>
      // Глобал, який реально ставить підключений GSAP — inline-скрипт
      // виконується при парсингу, на відміну від недосяжного CDN вище.
      window.gsap = { version: '3.12.0' };
    </script>
    <style>
      body {
        margin: 0;
        background: #ffffff;
        color: #18181b;
        font-family: Inter, system-ui, sans-serif;
      }
      section {
        padding: 24px;
      }
      /* Reveal-секції: до класу-маркера — невидимі й зсунуті вниз. */
      .reveal {
        opacity: 0;
        transform: translateY(32px);
        transition:
          opacity 600ms cubic-bezier(0.4, 0, 0.2, 1),
          transform 600ms cubic-bezier(0.4, 0, 0.2, 1);
      }
      .reveal.is-visible {
        opacity: 1;
        transform: none;
      }
      .cta {
        background: #2563eb;
        color: #ffffff;
        border: none;
        border-radius: 8px;
        padding: 8px 16px;
        transition: background-color 150ms ease-in-out;
      }
      .card {
        border: 1px solid #e4e4e7;
        border-radius: 8px;
        padding: 16px;
        transition:
          box-shadow 300ms ease,
          transform 300ms ease;
      }
      /* Обидва мають випасти з кластерів: `none` і нульова тривалість. */
      .no-transition {
        transition: none;
      }
      .zero-transition {
        transition: color 0s linear;
      }
      .badge {
        display: inline-block;
        animation: pulse-badge 2s infinite;
      }
      @keyframes pulse-badge {
        from {
          opacity: 1;
        }
        to {
          opacity: 0.5;
        }
      }
      @keyframes fade-in-up {
        from {
          opacity: 0;
          transform: translateY(16px);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }
      /* Вкладене в @media — доводить рекурсивний обхід CSSOM. */
      @media (min-width: 300px) {
        @keyframes nested-spin {
          from {
            transform: rotate(0deg);
          }
          to {
            transform: rotate(360deg);
          }
        }
      }
      .filler {
        height: 1600px;
      }
    </style>
  </head>
  <body>
    <main>
      <section class="hero" data-framer-appear-id="hero-1">
        <h1>Motion reference</h1>
        <div class="card">
          <p>Card with a hover-ready shadow transition.</p>
          <button class="cta">Buy now</button>
          <span class="badge">New</span>
          <span class="no-transition">Static label</span>
          <span class="zero-transition">Zero-duration label</span>
        </div>
      </section>
      <div class="filler"></div>
      <section class="reveal">
        <p>First section revealed on scroll.</p>
      </section>
      <div class="filler"></div>
      <section class="reveal">
        <p>Second section revealed on scroll.</p>
      </section>
      <section class="tail">
        <p>Tail section, never animated.</p>
      </section>
    </main>
    <script>
      var observer = new IntersectionObserver(function (entries) {
        entries.forEach(function (entry) {
          if (entry.isIntersecting) entry.target.classList.add('is-visible');
        });
      });
      document.querySelectorAll('.reveal').forEach(function (el) {
        observer.observe(el);
      });
    </script>
  </body>
</html>
