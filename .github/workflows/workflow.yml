name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  typecheck:
    name: TypeScript
    timeout-minutes: 8
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Format check
        run: pnpm format:check

      - name: Build
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

  test:
    name: Tests
    timeout-minutes: 10
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Run tests
        run: pnpm test

  www:
    name: Landing (apps/www)
    timeout-minutes: 8
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      # build ПЕРЕД typecheck — той самий інваріант, що в job typecheck:
      # `vite build` генерує apps/www/src/routeTree.gen.ts
      - name: Build landing (static prerender)
        run: pnpm build:www

      - name: Typecheck landing
        run: pnpm typecheck:www

  packaging:
    name: Packaging
    timeout-minutes: 20
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      # Окремий job, а не крок у `test`: parity-suite працює по tarball-ах і
      # тому вимагає зібраних `dist/` кожного пакета, яких у test-job немає.
      - name: Build packages
        run: pnpm build:packages

      # 🔴 Після `build:packages`: типізує шаблон магазину проти зібраного
      # `dist` — того самого, що бачить згенерований магазин. Кореневий
      # `pnpm typecheck` шаблон ВИКЛЮЧАЄ, тому без цього кроку помилка типів
      # у `template/routes.ts` проходить усі job-и зеленими, а магазин із
      # такого шаблону не збирається.
      - name: Typecheck store template
        run: pnpm typecheck:template

      - name: Tarball parity
        run: pnpm test:packaging

      # 🔴 Пілот пакування БЕЗ бази (рішення власника 2026-09-03, К2-Е0 T-2):
      # єдиний поведінковий доказ межі клієнт/сервер у реальному магазині з
      # tarball-ів — Gate C (серверного вантажу немає в чанках) і Gate IP
      # (витік ВАЛИТЬ збірку). Детермінований; +≈3–5 хв: install скретча і
      # три збірки скретча (дві червоні + чиста) поверх основної.
      # `--skip-build`: dist пакетів уже свіжий після кроку `Build packages`
      # вище — без прапорця пілот повторив би `build:packages` (кеп купи 3 ГБ).
      - name: Pilot (pack-only)
        run: pnpm pilot:pack --skip-build

  schema:
    name: Schema (PG harness)
    timeout-minutes: 10
    runs-on: ubuntu-latest

    # Service-контейнер: те саме, чим гейт користується локально через
    # PG_HARNESS_URL (розробник піднімає власний кластер) — тут CI піднімає
    # його сам, без Docker-у самого джоба (GitHub Actions services — це
    # окремий контейнер поруч, не наш `docker run`). Мажор 17 — той самий,
    # проти якого знято еталонний дамп політик (Task 5).
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: pgtest
          POSTGRES_DB: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U pgtest"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    env:
      PG_HARNESS_URL: postgresql://pgtest@localhost:5432/postgres

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Schema gate
        run: pnpm test:schema

# 🔴 `pnpm pilot` (Gate B проти живої БД) у CI НЕ ганяється — рішення власника
# (2026-08-01): зовнішній стан бази дрейфує без регресії коду. `pnpm
# pilot:pack` (без БД) у CI Є з 2026-09-03 — job `packaging` вище. Прогін
# `pilot` перед релізом — відповідальність розробника; команди — у CLAUDE.md.
