name: Publish Packages

# Публікація framework-agnostic пакетів SimplyCMS у GitHub Packages.
#
# Реєстр: https://npm.pkg.github.com — scope @simplysoftua збігається з
# власником репозиторію (вимога GitHub Packages), тому публікація
# авторизується вбудованим GITHUB_TOKEN (PAT не потрібен).
#
# Тригери:
#   - push semver-тегу v* (напр. v0.1.0) або ручний workflow_dispatch
#     → build + publish;
#   - pull_request / push гілки → лише build:packages (сплячий publish,
#     зелений build як gate).

on:
  push:
    branches: ['main']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  # Збірка публікованих пакетів — ганяється на КОЖЕН PR/push як gate.
  build:
    name: Build packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build publishable packages
        run: pnpm run build:packages

  # Публікація — лише на semver-тег v* або ручний workflow_dispatch.
  publish:
    name: Build & publish
    needs: build
    if: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: 'pnpm'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@simplysoftua'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build publishable packages
        run: pnpm run build:packages

      # Спершу публікуємо базовий @simplysoftua/objects (від нього залежать
      # решта), щоб уникнути 404 при concurrent-публікації (pnpm не
      # гарантує topo-порядок).
      - name: Publish objects (base)
        run: pnpm publish --filter @simplysoftua/objects --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Далі — залежні Tier 1/2. workspace:* → конкретна версія підставляється pnpm.
      - name: Publish dependents
        run: >-
          pnpm publish
          --filter @simplysoftua/domain
          --filter @simplysoftua/data-supabase
          --filter @simplysoftua/react-query
          --filter @simplysoftua/runtime
          --filter @simplysoftua/storefront
          --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
