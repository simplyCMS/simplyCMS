name: Publish Packages

# ⚠️ PUBLISH ПРИЗУПИНЕНО (2026-07-31, перенос у org simplyCMS).
# GitHub Packages вимагає «scope = власник»: scope @simplycms більше НЕ
# збігається з власником simplyCMS → публікація по тегу гарантовано падає з 403.
# За рішенням власника (spec §4.1) публікація переїжджає на npmjs під scope
# @simplycms — workflow переписується у Фазі 0 роадмапу разом із rename scope
# (потрібен secret NPM_TOKEN від npm org simplycms).
# Build-джоба лишається активною як gate на кожен PR/push.

on:
  push:
    branches: ['main']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  # Збірка публікованих пакетів — ганяється на КОЖЕН PR/push як gate.
  build:
    name: Build packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build publishable packages
        run: pnpm run build:packages

  # Публікація — ПРИЗУПИНЕНА до Фази 0 (див. шапку файлу). if: false — щоб
  # випадковий тег не давав заплутаних 403 від GitHub Packages.
  publish:
    name: Build & publish
    needs: build
    if: false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: 'pnpm'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@simplycms'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build publishable packages
        run: pnpm run build:packages

      # Спершу публікуємо базовий @simplycms/objects (від нього залежать
      # решта), щоб уникнути 404 при concurrent-публікації (pnpm не
      # гарантує topo-порядок).
      - name: Publish objects (base)
        run: pnpm publish --filter @simplycms/objects --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Далі — залежні Tier 1/2. workspace:* → конкретна версія підставляється pnpm.
      - name: Publish dependents
        run: >-
          pnpm publish
          --filter @simplycms/domain
          --filter @simplycms/data-supabase
          --filter @simplycms/react-query
          --filter @simplycms/runtime
          --filter @simplycms/storefront
          --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
