name: Publish Packages

# Публікація ядра на npmjs під scope @simplycms.
#
# Модель (рішення власника, 2026-08-01):
#   • тригер — push у `main`; публікуються тільки ті пакети, чиєї версії ще
#     немає в реєстрі. `pnpm publish -r` робить цю перевірку сам
#     (`isAlreadyPublished`), тож merge без бампа версії — no-op для тих, хто
#     ВЖЕ в реєстрі; пакет, якого там немає, мерж публікує;
#   • версія у всіх пакетів СИНХРОННА, бампається `pnpm release X.Y.Z`,
#     далі звичайний PR у main;
#   • `workflow_dispatch` — ручний ретрай, якщо прогін упав на середині
#     (частково опубліковані пакети другий раз не публікуються);
#   • після УСПІШНОЇ публікації CI ставить анотований тег `vX.Y.Z` на
#     поточний SHA і пушить його в origin — тег означає «опубліковано», а не
#     «підготовлено». Крок ідемпотентний — docs/architecture/release-process.md,
#     розділ «Теги релізів».
#
# Авторизація — npm Trusted Publishing (OIDC, з 2026-11-05): секрету-токена
# немає. pnpm обмінює OIDC-токен GitHub Actions (`id-token: write`) на право
# публікації й сам додає provenance. Trusted publisher налаштований на npmjs
# для КОЖНОГО з 5 пакетів окремо й прив'язаний до цього файлу воркфлоу;
# provenance звіряє `repository.url` маніфесту з цим репо. Нового пакета
# (ще не в реєстрі) так не опублікувати — його першу версію публікує власник
# руками (release-process.md, «Перша публікація нового пакета»).

on:
  push:
    branches: ['main']
  workflow_dispatch:

jobs:
  publish:
    name: Publish to npmjs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Trusted publisher прив'язаний до файлу воркфлоу, а не до гілки: ручний
    # запуск (`workflow_dispatch`) з іншої гілки опублікував би неперевірений код.
    if: github.ref == 'refs/heads/main'
    # 🔴 Мінімально необхідний обсяг: `contents: write` — лише заради push тега
    # після публікації (крок «Tag release»); `id-token: write` — OIDC-токен для
    # Trusted Publishing. Без нього pnpm пише «Skipped OIDC:
    # ERR_PNPM_ID_TOKEN_GITHUB_WORKFLOW_INCORRECT_PERMISSIONS» і npm відповідає
    # 404 на PUT (спіймано на релізі 0.16.0, 2026-11-05).
    permissions:
      contents: write
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'
          # 🔴 Без `registry-url` setup-node не створює `.npmrc` з реєстром
          # публікації → 401/ENEEDAUTH.
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build publishable packages
        run: pnpm run build:packages

      # Гейт перед публікацією: parity-suite працює по РОЗПАКОВАНИХ tarball-ах,
      # тобто перевіряє рівно те, що поїде в реєстр (exports вказують на наявні
      # файли, нуль `workspace:` у dependencies).
      - name: Tarball parity gate
        run: pnpm run test:packaging

      # Provenance під Trusted Publishing pnpm додає сам (публічний пакет із
      # публічного репо), окремий `--provenance` не потрібен.
      # `-r` публікує рекурсивно й пропускає версії, які вже в реєстрі, тож
      # merge без бампа — no-op. `--access public`: scoped-пакети npm за
      # замовчуванням робить приватними, а це платний план.
      # `--no-git-checks`: у CI HEAD detached, і pnpm інакше відмовляється.
      # `--tag`: пре-реліз (`1.0.0-rc.N`) йде під `next`, а не `latest` —
      # інакше `npm i simplycms` і `simplycms update` схопили б RC як стабільний.
      - name: Publish
        run: |
          tag="$(node scripts/release/dist-tag.mjs --print)"
          case "$tag" in latest|next) ;; *) echo "::error::dist-tag: '$tag'"; exit 1;; esac
          pnpm publish -r --access public --no-git-checks --tag "$tag"

      # Тег ставимо ЛИШЕ після успішної публікації (цей крок не запуститься,
      # якщо впав крок Publish — дефолтна поведінка GitHub Actions), тож
      # тег `vX.Y.Z` означає «опубліковано», а не «підготовлено». Версію
      # беремо з манифеста (те саме джерело правди, що й у `pnpm release`),
      # а не з імені гілки — гілка релізу не завжди канонічна
      # `release/vX.Y.Z` (release-process.md, крок 2).
      #
      # 🔴 Ідемпотентність: `workflow_dispatch` — ручний ретрай після падіння
      # на середині. `pnpm publish -r` сам пропускає вже опубліковані версії
      # (no-op), тож повторний прогін дійде і до цього кроку з тією самою
      # версією. Без явної перевірки `git push origin refs/tags/vX` на вже
      # існуючий тег впав би (non-fast-forward) — перевіряємо REMOTE
      # (`git ls-remote`), не локальний `git tag --list`: у щойно
      # зачекаутченому раннері локальних тегів немає в принципі, тож
      # локальна перевірка була б завжди порожньою і сенсу не мала б.
      - name: Tag release
        run: |
          set -euo pipefail
          VERSION="$(node -e "import('./scripts/release/bump.mjs').then(m => console.log(m.currentVersion()))")"
          TAG="v${VERSION}"

          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null; then
            echo "Тег ${TAG} уже є в remote — пропускаю (ретрай або no-op публікація)."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${TAG}" -m "Реліз ${TAG}: опубліковано на npmjs"
          git push origin "refs/tags/${TAG}"
          echo "Тег ${TAG} створено і запушено."
