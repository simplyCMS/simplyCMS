# Dev/CI-конфіг Garage для стенду (`pnpm harness:up`, job Schema у CI): одновузловий
# кластер без реплікації й автознімків метаданих — на одноразовому томі вони лише шумлять.
# rpc_secret задає змінна GARAGE_RPC_SECRET, не цей файл.
metadata_dir = "/var/lib/garage/meta"
data_dir = "/var/lib/garage/data"
db_engine = "lmdb"

replication_factor = 1

rpc_bind_addr = "[::]:3901"
rpc_public_addr = "127.0.0.1:3901"

[s3_api]
s3_region = "garage"
api_bind_addr = "[::]:3900"
